[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-phone-bridge"
version = "0.1.0"
description = "Host relay and Hermes plugin for the RexBridge phone transport"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "host"}
py-modules = ["hermes_phone_relay", "call_audio_loop", "physical_acceptance_gate", "physical_success_gate"]

[tool.pytest.ini_options]
testpaths = ["host"]
python_files = ["test_*.py"]
addopts = "-ra"
